plugins {
    id 'application'
}

group = 'com.example'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs << '-Xlint:all'
}

processResources {
    // Puts the project version into build-info.properties, which is where the service reads its version from.
    def projectVersion = project.version
    inputs.property('version', projectVersion)
    filesMatching('build-info.properties') {
        expand(version: projectVersion)
    }

    // The web interface is the frontend folder next to this project; the service serves it from the classpath.
    from('../frontend') {
        include 'index.html', 'css/**', 'js/**', 'vendor/**'
        exclude '**/README.md'
        into 'static'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

application {
    mainClass = 'com.example.reportservice.ReportService'
}
