<!doctype html>
<!-- The page that the service prints to make a PDF (see js/render.js): index.html without the toolbar. The scripts and
     styles have to be the same as those of index.html. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/or-theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "lit": "./vendor/lit.js",
        "@openremote/core": "./js/kit/core.js",
        "@openremote/model": "./js/kit/model.js",
        "@openremote/or-icon": "./js/kit/or-icon.js",
        "@openremote/rest": "./js/kit/rest.js",
        "@openremote/or-vaadin-components/or-vaadin-combo-box": "./vendor/or-vaadin.js",
        "@openremote/or-vaadin-components/or-vaadin-confirm-dialog": "./vendor/or-vaadin.js",
        "@openremote/or-vaadin-components/or-vaadin-date-time-picker": "./vendor/or-vaadin.js",
        "@openremote/or-vaadin-components/or-vaadin-item": "./vendor/or-vaadin.js",
        "@openremote/or-vaadin-components/or-vaadin-list-box": "./vendor/or-vaadin.js",
        "@openremote/or-vaadin-components/or-vaadin-menu-bar": "./vendor/or-vaadin.js",
        "@openremote/or-translate": "./vendor/or-vaadin.js"
      }
    }
  </script>
  <script src="vendor/gridstack-all.js"></script>
</head>
<body>
  <main class="layout">
    <section class="workspace">
      <article class="paper" id="paper">
        <or-dashboard-preview id="preview"></or-dashboard-preview>
      </article>
    </section>
    <or-dashboard-sidebar id="sidebar" hidden></or-dashboard-sidebar>
  </main>

  <script type="module" src="js/render.js"></script>
</body>
</html>
